[tool.poetry]
name = "deckhouse"
version = "0.0.1" # this version bumps via Github action on release publish
description = "Wrapper for hooks for Deckhouse, Addon Operator, and Shell Operator by Flant"
authors = ["Eugene Shevchenko <evgeny.shevchenko@flant.com>"]
license = "Apache License 2.0"
readme = "README.md"
packages = [{ include = "deckhouse" }]


[tool.poetry.dependencies]
python = "^3.12"
dictdiffer = "^0.9.0"
dotmap = "^1.3.30"

[tool.poetry.group.dev.dependencies]
black = "^22.12.0"
pylint = "^4.0.0"
pytest = "^7.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
